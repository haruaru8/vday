<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valentine 💖</title>

<style>

/* ---------- GENERAL ---------- */

body{
 margin:0;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

.screen{
 display:none;
 height:100vh;
 justify-content:center;
 align-items:center;
 flex-direction:column;
}

.active{
 display:flex;
}

/* ---------- WORDLE SCREEN ---------- */

.wordle{
 background:linear-gradient(#ffffff,#ffe4ec);
}

.wrapper{
 text-align:center;
 width:360px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(5,64px);
 gap:10px;
 justify-content:center;
 margin-bottom:25px;
}

.tile{
 width:64px;
 height:64px;
 border-radius:14px;
 background:#ffdce6;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:28px;
 font-weight:bold;
 color:#333;

 /* ⭐ ADDED SHADOW */
 box-shadow:0 3px 0 #e7a8ba;
}

.green{background:#2ecc71;color:white;}
.yellow{background:#f6c344;color:white;}
.gray{background:#cfcfcf;color:white;}

.kb{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:center;gap:6px}

.key{
 background:#ffdce6;
 padding:12px;
 border-radius:10px;
 min-width:28px;
 text-align:center;
 cursor:pointer;
 font-weight:bold;

 /* ⭐ ADDED SHADOW */
 box-shadow:0 3px 0 #e7a8ba;
}

.key.green{background:#2ecc71;color:white}
.key.yellow{background:#f6c344;color:white}
.key.gray{background:#bbb;color:white}

.btn{
 background:#ff6fa5;
 border:none;
 padding:12px 18px;
 border-radius:12px;
 color:white;
 font-size:16px;
 margin:5px;
 cursor:pointer;
}

/* ---------- VALENTINE SCREEN ---------- */

.valentine{
 background:linear-gradient(#ffffff,#ffe4ec);
 color:#d6336c;
 text-align:center;
}

.vgrid{
 display:grid;
 grid-template-columns:repeat(5,70px);
 gap:12px;
 justify-content:center;
 margin-bottom:30px;
}

/* Filled boxes stay darker pink */
.vtile{
 width:70px;
 height:70px;
 border-radius:14px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:26px;
 font-weight:bold;
 color:white;
 box-shadow:0 4px 0 #e08aa2;
}

/* ⭐ EMPTY BOXES NOW MATCH WORDLE */
.vtile:empty{
 background:#ffdce6;
 box-shadow:0 3px 0 #e7a8ba;
}

/* Filled tiles */
.vtile:not(:empty){
 background:#ffb3c7;
}

.bottom{
 display:flex;
 gap:8px;
 justify-content:center;
 flex-wrap:wrap;
}

.bottom div{
 width:60px;
 height:60px;
 background:#ffb3c7;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:22px;
 color:white;
 box-shadow:0 4px 0 #e08aa2;
}

</style>
</head>

<body>

<!-- WORDLE SCREEN -->

<div id="game" class="screen active wordle">

<div class="wrapper">

<div id="grid" class="grid"></div>
<div id="keyboard" class="kb"></div>

<button class="btn" onclick="resetGame()">Play Again</button>
<button class="btn" onclick="goValentine()">Give Up?</button>

</div>
</div>


<!-- VALENTINE SCREEN -->

<div id="val" class="screen valentine">

<div class="vgrid">

<div class="vtile">W</div>
<div class="vtile">I</div>
<div class="vtile">L</div>
<div class="vtile">L</div>
<div class="vtile"></div>

<div class="vtile">Y</div>
<div class="vtile">O</div>
<div class="vtile">U</div>
<div class="vtile"></div>
<div class="vtile"></div>

<div class="vtile">B</div>
<div class="vtile">E</div>
<div class="vtile"></div>
<div class="vtile"></div>
<div class="vtile"></div>

<div class="vtile">M</div>
<div class="vtile">Y</div>
<div class="vtile"></div>
<div class="vtile"></div>
<div class="vtile"></div>

</div>

<div class="bottom">
<div>V</div><div>A</div><div>L</div><div>E</div>
<div>N</div><div>T</div><div>I</div><div>N</div>
<div>E</div><div>?</div>
</div>

</div>

<script>

function goValentine(){
 document.getElementById("game").classList.remove("active");
 document.getElementById("val").classList.add("active");
}

const answer="ilyaj";
const phrase="willyoubemyvalentine";

let row=0;
let current="";
const grid=document.getElementById("grid");
const kb=document.getElementById("keyboard");

const layout=["qwertyuiop","asdfghjkl","zxcvbnm"];
let keyMap={};

for(let i=0;i<30;i++){
 let d=document.createElement("div");
 d.className="tile";
 grid.appendChild(d);
}

layout.forEach(line=>{
 let r=document.createElement("div");
 r.className="row";

 line.split("").forEach(l=>{
  let k=document.createElement("div");
  k.className="key";
  k.textContent=l;
  k.onclick=()=>press(l);
  r.appendChild(k);
  keyMap[l]=k;
 });

 kb.appendChild(r);
});

let r=document.createElement("div");
r.className="row";

let enter=document.createElement("div");
enter.className="key";
enter.textContent="ENTER";
enter.onclick=submit;
r.appendChild(enter);

let del=document.createElement("div");
del.className="key";
del.textContent="⌫";
del.onclick=()=>{current=current.slice(0,-1);draw();};
r.appendChild(del);

kb.appendChild(r);

function press(l){
 if(current.length<5){
  current+=l;
  draw();
 }
}

function draw(){
 for(let i=0;i<5;i++){
  grid.children[row*5+i].textContent=current[i]||"";
 }
}

function colorKey(letter,color){
 let k=keyMap[letter];
 if(!k) return;

 if(k.classList.contains("green")) return;
 if(k.classList.contains("yellow") && color==="gray") return;

 k.classList.remove("green","yellow","gray");
 k.classList.add(color);
}

function submit(){
 if(current.length!==5) return;

 for(let i=0;i<5;i++){
  let tile=grid.children[row*5+i];
  let l=current[i];
  let color;

  if(l===answer[i]) color="green";
  else if(answer.includes(l) || phrase.includes(l)) color="yellow";
  else color="gray";

  tile.classList.add(color);
  colorKey(l,color);
 }

 if(current===answer){
   setTimeout(goValentine,700);
 }

 row++;
 current="";
}

function resetGame(){
 location.reload();
}

</script>

</body>
</html>
