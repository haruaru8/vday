<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle</title>

<style>

/* ---------- BASE ---------- */
body{
 margin:0;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

.screen{
 display:none;
 height:100vh;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 opacity:0;
 transition:opacity .6s ease;
}
.active{
 display:flex;
 opacity:1;
}

.wordle{ background:linear-gradient(#fff,#ffe4ec); }

/* ---------- ANIMATIONS ---------- */
@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-6px)}
100%{transform:translateY(0)}
}

@keyframes heartRise{
from{transform:translateY(60px);opacity:0}
to{transform:translateY(-700px);opacity:1}
}

@keyframes loveGlow{
0%{transform:scale(.9); opacity:0; filter:blur(8px)}
100%{transform:scale(1); opacity:1; filter:blur(0)}
}

/* Glow on BOTH Valentine and YES entrance */
.valentine.active,
.yesScreen.active{
 animation:loveGlow .9s ease forwards;
}

@keyframes heartbeat{
0%{transform:scale(1)}
30%{transform:scale(1.12)}
60%{transform:scale(.95)}
100%{transform:scale(1)}
}

/* ---------- WORDLE ---------- */
.wrapper{ width:360px;text-align:center;}

.grid{
 display:grid;
 grid-template-columns:repeat(5,64px);
 gap:10px;margin-bottom:25px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,64px);
 gap:10px;margin-bottom:10px;
}

.tile{
 width:64px;height:64px;
 border-radius:14px;
 background:#ffdce6;
 display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:bold;color:#000;
 box-shadow:0 3px 0 #e7a8ba;
}

.green{background:#2ecc71;color:white;}
.yellow{background:#f6c344;color:white;}
.gray{background:#cfcfcf;color:white;}

.kb{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:center;gap:6px}

.key{
 background:#ffdce6;
 padding:12px;border-radius:10px;
 cursor:pointer;font-weight:bold;
 box-shadow:0 3px 0 #e7a8ba;
}
.key.green{background:#2ecc71;color:white}
.key.yellow{background:#f6c344;color:white}
.key.gray{background:#bbb;color:white}

/* ---------- BUTTON ---------- */
.btn{
 background:#ffdce6;border:none;
 padding:12px 18px;
 border-radius:12px;
 color:#d6336c;margin:5px;
 cursor:pointer;
 box-shadow:0 3px 0 #e7a8ba;
}

/* ---------- VALENTINE ---------- */
.valentine{ background:linear-gradient(#fff,#ffe4ec); cursor:pointer;}

.vgrid{
 display:grid;
 grid-template-columns:repeat(5,70px);
 gap:12px;
 margin-bottom:30px;
}

.vtile{
 width:70px;height:70px;
 border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 font-size:26px;font-weight:bold;color:white;
 background:#ffb3c7;
 box-shadow:0 4px 0 #e08aa2;
 animation:float 2s infinite ease-in-out;
}
.vtile:empty{
 background:#ffdce6;
 box-shadow:0 3px 0 #e7a8ba;
}

/* HEARTBEAT ONLY FOR "VALENTINE?" TILES */
.bottom{
 display:grid;
 grid-template-columns:repeat(10,70px);
 gap:12px;
}
.bottom div{
 width:70px;height:70px;
 background:#ffb3c7;
 border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold;font-size:26px;color:white;
 box-shadow:0 4px 0 #e08aa2;

 animation:
   float 2.5s infinite ease-in-out,
   heartbeat 1.6s infinite ease-in-out;
}

/* ---------- SECOND ---------- */
.typeText{ color:#d6336c;font-weight:bold;margin-bottom:8px;}
.hint{ color:#ff8fb3; }

/* ---------- POPUP ---------- */
.popup{
 position:fixed;inset:0;
 display:none;justify-content:center;align-items:center;
 background:rgba(0,0,0,.4);
}
.popupBox{
 background:white;padding:30px;
 border-radius:16px;text-align:center;
}
#popupText{
 color:#d6336c;
 margin-bottom:20px;
 font-weight:bold;
}
.popupBox button{
 background:#ffdce6;border:none;
 padding:10px 20px;border-radius:12px;
 color:#d6336c;font-weight:bold;
 box-shadow:0 3px 0 #e7a8ba;
}

/* ---------- YES ---------- */
.yesScreen{
 background:linear-gradient(#fff,#ffe4ec);
 text-align:center;color:#d6336c;
 overflow:hidden;
}
.yesTiles{display:flex;gap:12px;margin:20px;}
.yesTile{
 width:70px;height:70px;
 background:#ffb3c7;border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 font-size:30px;font-weight:bold;color:white;
 box-shadow:0 4px 0 #e08aa2;
 animation:heartbeat 1.5s infinite;
}
.heart{
 position:absolute;font-size:22px;
 color:#ff6fa5;
 animation:heartRise linear infinite;
}
</style>

</head>

<body>

<!-- WORDLE -->

<div id="game" class="screen active wordle">
<div class="wrapper">
<div id="grid" class="grid"></div>
<div id="keyboard" class="kb"></div>
<button class="btn" onclick="resetGame()">Play Again</button>
<button class="btn" onclick="goValentine()">Give Up?</button>
</div>
</div>

<!-- VALENTINE -->

<div id="val" class="screen valentine" onclick="goSecond()">
<div class="vgrid">
<div class="vtile">W</div><div class="vtile">I</div><div class="vtile">L</div><div class="vtile">L</div><div class="vtile"></div>
<div class="vtile">Y</div><div class="vtile">O</div><div class="vtile">U</div><div class="vtile"></div><div class="vtile"></div>
<div class="vtile">B</div><div class="vtile">E</div><div class="vtile"></div><div class="vtile"></div><div class="vtile"></div>
<div class="vtile">M</div><div class="vtile">Y</div><div class="vtile"></div><div class="vtile"></div><div class="vtile"></div>
</div>

<div class="bottom">
<div>V</div><div>A</div><div>L</div><div>E</div>
<div>N</div><div>T</div><div>I</div><div>N</div>
<div>E</div><div>?</div>
</div>
</div>

<!-- SECOND + SCRIPT LEFT UNCHANGED -->

<script>

</script>

</body>
</html>
